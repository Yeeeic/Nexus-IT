# Opt-in single-node TLS edge. Requires Docker Compose >= 2.24.4.
services:
  backend:
    ports: !override
      - "127.0.0.1:${NEXUS_API_PORT:-8000}:8000"
    environment:
      NEXUS_ENV: production
      # Only trusted local containers/operator can reach the HTTP backend.
      FORWARDED_ALLOW_IPS: "*"
  frontend:
    ports: !override []
  tls:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "${NEXUS_BIND_IP:-0.0.0.0}:80:8080"
      - "${NEXUS_BIND_IP:-0.0.0.0}:443:8443"
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${NEXUS_TLS_CERT_FILE:?Provide absolute full-chain PEM path}
        target: /run/nexus-tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEXUS_TLS_KEY_FILE:?Provide absolute private-key PEM path}
        target: /run/nexus-tls/privatekey.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777,uid=101,gid=101
      - /var/run:size=4m,mode=1777,uid=101,gid=101
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge]
