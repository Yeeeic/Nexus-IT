map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /run/nexus-tls/fullchain.pem;
    ssl_certificate_key /run/nexus-tls/privatekey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:NEXUS:10m;
    client_max_body_size 11m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Never log query strings: password-reset links may contain credentials.
    access_log off;
    error_log /dev/stderr warn;

    location = /tls-health {
        return 204;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
}
