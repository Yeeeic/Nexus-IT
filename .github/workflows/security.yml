name: Security and CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  frontend:
    name: Frontend Verification (TypeScript, Vitest, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: TypeScript Static Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Vitest Unit & Integration Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Vite Production Build
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Backend Tests, Postgres RLS, and Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install reviewed dependencies
        run: "python -m pip install --only-binary=:all: -r backend/requirements-dev.txt"
      - name: Create ephemeral CI secrets
        shell: bash
        run: |
          umask 077
          {
            echo 'NEXUS_ENV=test'
            echo 'NEXUS_API_PORT=8000'
            echo 'NEXUS_POSTGRES_DB=nexus_it'
            echo 'NEXUS_POSTGRES_USER=nexus_bootstrap'
            echo "NEXUS_POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "NEXUS_RUNTIME_POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "NEXUS_REDIS_PASSWORD=$(openssl rand -hex 32)"
            echo "NEXUS_SERVER_PEPPER=$(openssl rand -hex 32)"
          } > .env
      - name: Start private data services
        run: docker compose --env-file .env -f infra/compose.yaml up --detach postgres redis
      - name: Apply database migrations
        run: docker compose --env-file .env -f infra/compose.yaml --profile tools run --rm --build migrate
      - name: Provision minimum-privilege runtime principal
        run: docker compose --env-file .env -f infra/compose.yaml --profile tools run --rm provision-runtime
      - name: Run backend tests
        run: python -m pytest
        env:
          NEXUS_RUN_DB_TESTS: "1"
      - name: Audit production dependencies
        run: python -m pip_audit -r backend/requirements.lock
      - name: Stop ephemeral CI services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down --volumes --remove-orphans
