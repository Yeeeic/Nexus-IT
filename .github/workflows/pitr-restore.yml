name: Monthly isolated PITR rehearsal

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitr-restore-rehearsal
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Run static PITR safety contracts
        run: python -m pytest -q tests/infra/test_pitr_scripts.py
      - name: Run isolated PITR rehearsal
        run: bash tests/infra/pitr-rehearsal.sh
